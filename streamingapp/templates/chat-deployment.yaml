# chat-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-deployment
spec:
  replicas: {{ .Values.services.chat.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
      - name: chat
        image: "{{ .Values.services.chat.image }}:{{ .Values.services.chat.tag }}"
        ports:
        - containerPort: {{ .Values.services.chat.port }}
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
