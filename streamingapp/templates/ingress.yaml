apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamingapp-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - http:
      paths:
      - path: /api/auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-svc
            port:
              number: 3000
      - path: /api/streaming
        pathType: Prefix
        backend:
          service:
            name: streaming-svc
            port:
              number: 3002
      - path: /api/admin
        pathType: Prefix
        backend:
          service:
            name: admin-svc
            port:
              number: 3003
      - path: /api/chat
        pathType: Prefix
        backend:
          service:
            name: chat-svc
            port:
              number: 3004
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80
