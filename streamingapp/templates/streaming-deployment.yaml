# streaming-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-deployment
spec:
  replicas: {{ .Values.services.streaming.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: streaming
  template:
    metadata:
      labels:
        app: streaming
    spec:
      containers:
      - name: streaming
        image: "{{ .Values.services.streaming.image }}:{{ .Values.services.streaming.tag }}"
        ports:
        - containerPort: {{ .Values.services.streaming.port }}
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
